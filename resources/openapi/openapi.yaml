openapi: 3.0.3

info:
  title: Lumna API
  version: 0.41.1
  description: |
    HTTP API of the Lumna server. Source of truth: `app/adapters/api/router.go`
    and the handlers in `app/adapters/api/handler/*`.

    ## Authentication

    Authentication is **cookie based**. `POST /api/v1/auth/login` (and
    `POST /api/v1/auth/refresh`) respond with two `Set-Cookie` headers:

    | Cookie          | Path           | Purpose                                                  |
    | --------------- | -------------- | -------------------------------------------------------- |
    | `access_token`  | `/`            | Short lived JWT read by the auth middleware on every private route |
    | `refresh_token` | `/api/v1/auth` | Long lived opaque token, used by `/auth/refresh` and `/auth/logout` |

    Both are `HttpOnly`. With secure cookies enabled they are also `Secure` and
    `SameSite=None`, otherwise `SameSite=Lax`. Lifetimes come from the server config.

    Everything under `/api/v1` except the `/api/v1/auth/*` group requires a valid
    `access_token`; otherwise the middleware answers `401` with code `AUTH006`.

    ## Response envelope

    Every handler answers with the same envelope (`httpx.APIResponse`):

    - `status` is `false` for any HTTP status >= 400;
    - `data` carries the payload and is **omitted** when the handler returns `nil`;
    - `messages` and `errors` are omitted when empty.

    ## Errors

    Domain errors carry a kind that maps to the HTTP status
    (validation → 400, unauthenticated → 401, forbidden → 403, not found → 404,
    conflict → 409, rate limited → 429) and a `code`. Any other error (for example
    a non-numeric path/query id or malformed JSON) is reported as
    `500 INTERNAL_ERROR` with the message `internal server error`.

    ## Trying requests from Swagger UI

    The bundled UI at `/api-docs` is served by the API itself, so it is same-origin
    and the browser sends your real session cookies with every "Try it out" call.
    Use the **Session cookies** panel above the operations to paste tokens into
    real cookies on this origin.

servers:
  - url: /
    description: Same origin as this documentation page (send real cookies)
  - url: http://localhost:8000
    description: Local development server (serve.port in config.yaml)

tags:
  - name: auth
    description: Login, logout and token refresh
  - name: user
    description: Current identity and account management
  - name: sessions
    description: Refresh tokens of the current identity
  - name: workspaces
    description: Top level tenant container
  - name: members
    description: Workspace members
  - name: invitations
    description: Email invitations into a workspace
  - name: projects
    description: Projects inside a workspace
  - name: boards
    description: Kanban boards of a project
  - name: columns
    description: Columns (stages) of a board
  - name: tasks
    description: Tasks placed on boards

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Verifies the credentials and sets the `access_token` and `refresh_token`
        cookies. The body carries no `data`; load the identity with
        `GET /api/v1/user/me`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: true
                messages: ["Login successful"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials (`AUTH001`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: |
        Deletes the refresh token from the `refresh_token` cookie and expires both
        cookies.
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Both cookies are sent back with `Max-Age=-1`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: true
                messages: ["Logged out"]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the token pair
      description: |
        Exchanges the `refresh_token` cookie for a new access/refresh pair. On any
        failure both cookies are cleared.
      operationId: refresh
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New cookies issued
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: true
                messages: ["Session refreshed"]
        '401':
          description: Refresh token unknown (`AUTH002`), expired (`AUTH003`) or revoked (`AUTH004`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ---------------------------------------------------------------- user
  /api/v1/user/me:
    get:
      tags: [user]
      summary: Current identity
      operationId: getCurrentUser
      responses:
        '200':
          description: The identity behind the `access_token` cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user:
    patch:
      tags: [user]
      summary: Update the current identity
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChange'
      responses:
        '200':
          description: Updated identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Malformed JSON or an unparseable email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/user/change-password:
    post:
      tags: [user]
      summary: Change the password of the current identity
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          $ref: '#/components/responses/SuccessTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Passwords do not match (`AUTH003`), password too weak (`AUTH004`) or the
            change was rejected (`AUTH002`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/user/delete-account:
    post:
      tags: [user]
      summary: Delete the current identity
      description: Deletes the account and clears both session cookies.
      operationId: deleteAccount
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [deleted]
                        properties:
                          deleted:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- sessions
  /api/v1/sessions/refresh-tokens:
    get:
      tags: [sessions]
      summary: List refresh tokens of the current identity
      operationId: listRefreshTokens
      responses:
        '200':
          description: Refresh tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RefreshToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sessions/refresh-tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/RefreshTokenId'
    delete:
      tags: [sessions]
      summary: Delete a refresh token
      operationId: deleteRefreshToken
      responses:
        '200':
          $ref: '#/components/responses/SuccessTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sessions/refresh-tokens/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/RefreshTokenId'
    patch:
      tags: [sessions]
      summary: Revoke a refresh token
      operationId: revokeRefreshToken
      responses:
        '200':
          description: The revoked token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- workspaces
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '200':
          description: Created workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/workspaces/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    delete:
      tags: [workspaces]
      summary: Delete a workspace
      operationId: deleteWorkspace
      responses:
        '200':
          $ref: '#/components/responses/SuccessTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{workspace_id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [members]
      summary: List workspace members
      operationId: listWorkspaceMembers
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/workspaces/{workspace_id}/members/remove:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [members]
      summary: Remove a member from a workspace
      description: |
        The handler reads `workspace_id` from the **body**; the path parameter is
        not used.
      operationId: removeWorkspaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRemove'
      responses:
        '200':
          $ref: '#/components/responses/SuccessTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{workspace_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [invitations]
      summary: List invitations of a workspace
      operationId: listInvitations
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [invitations]
      summary: Invite someone into a workspace
      description: |
        `invited_by` is taken from the current identity. The handler reads
        `workspace_id` from the **body**; the path parameter is not used.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '200':
          description: Created invitation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/workspaces/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [invitations]
      summary: Delete an invitation
      operationId: deleteInvitation
      responses:
        '200':
          $ref: '#/components/responses/SuccessTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/invitations/{invitation_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      summary: Revoke an invitation
      operationId: revokeInvitation
      responses:
        '200':
          description: The revoked invitation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- projects
  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects of a workspace
      operationId: listProjects
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [projects]
      summary: Create a project
      description: The owner is the current identity.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: Created project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [projects]
      summary: Rename a project
      description: |
        Uses the same payload as create, so `workspace_id` is required by
        validation even though only `title` is applied.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Delete a project
      operationId: deleteProject
      responses:
        '200':
          description: Deleted (no `data`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- boards
  /api/v1/boards:
    get:
      tags: [boards]
      summary: List boards of a project
      operationId: listBoards
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Boards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [boards]
      summary: Create a board
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardCreate'
      responses:
        '200':
          description: Created board
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- columns
  /api/v1/columns:
    get:
      tags: [columns]
      summary: List columns of a board
      operationId: listColumns
      parameters:
        - name: board_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Columns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Column'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [columns]
      summary: Create a column
      operationId: createColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreate'
      responses:
        '200':
          description: Created column
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/columns/{column_id}:
    parameters:
      - $ref: '#/components/parameters/ColumnId'
    delete:
      tags: [columns]
      summary: Delete a column
      description: |
        With `with_tasks=true` the tasks of the column are deleted as well and
        their ids are returned in `tasks`.
      operationId: deleteColumn
      parameters:
        - name: with_tasks
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Column deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ColumnDeleteResult'
              example:
                status: true
                data:
                  id: 12
                  tasks: [101, 102]
                messages: ["Stage deleted"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- tasks
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks of a board
      operationId: listTasks
      parameters:
        - name: board_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Created task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tasks/move:
    post:
      tags: [tasks]
      summary: Board action (move task, move column, change stage)
      description: |
        A single endpoint for drag and drop on a board. `action` selects the shape
        of `data` and of the response:

        | `action`       | `data`               | response `data` |
        | -------------- | -------------------- | --------------- |
        | `move_task`    | `MoveTaskData`       | `Task`          |
        | `change_stage` | `ChangeStageData`    | `Task`          |
        | `move_column`  | `MoveColumnData`     | `Column`        |

        An unknown action fails with `400 unknown_board_action`.
      operationId: boardAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardAction'
      responses:
        '200':
          description: Moved entity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/Task'
                          - $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [tasks]
      summary: Update a task
      description: |
        The handler updates the task from `task_id` in the **body**; the path
        parameter is not used.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tasks]
      summary: Delete a task
      operationId: deleteTask
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: boolean
                        example: true
              example:
                status: true
                data: true
                messages: ["Task [42] deleted."]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{task_id}/assign:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [tasks]
      summary: Assign a task
      description: |
        The handler reads `task_id` from the **body**; the path parameter is not
        used. The response carries no `data`.
      operationId: assignTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssign'
      responses:
        '200':
          description: Assigned (no `data`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Short lived JWT issued by `POST /api/v1/auth/login`. The cookie is
        `HttpOnly`, so the Authorize dialog of Swagger UI cannot set it. Use the
        **Session cookies** panel on the documentation page.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Long lived opaque token, scoped to `Path=/api/v1/auth`. Used by
        `/auth/refresh` and `/auth/logout`.

  headers:
    SessionCookies:
      description: |
        Two headers are sent:
        `access_token=<jwt>; Path=/; Max-Age=<ttl>; HttpOnly[; Secure]` and
        `refresh_token=<token>; Path=/api/v1/auth; Max-Age=<ttl>; HttpOnly[; Secure]`.
      schema:
        type: string

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: integer
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: integer
    RefreshTokenId:
      name: id
      in: path
      required: true
      description: Refresh token id
      schema:
        type: integer
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
    ColumnId:
      name: column_id
      in: path
      required: true
      description: Column (stage) id. Registered in the router as `:stage_id`.
      schema:
        type: integer
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    SuccessTrue:
      description: Success, `data` is `true`
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    type: boolean
                    example: true
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Missing, expired or invalid `access_token` cookie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: false
            errors:
              - message: access token is missing or invalid
                code: AUTH006
    Forbidden:
      description: The current identity may not access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: The operation conflicts with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    # ------------------------------------------------------------ envelope
    ApiResponse:
      type: object
      required: [status]
      properties:
        status:
          type: boolean
          description: '`false` for any HTTP status >= 400'
        data:
          description: Payload; omitted when the handler returns nothing
        messages:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    ApiErrorResponse:
      type: object
      required: [status, errors]
      properties:
        status:
          type: boolean
          example: false
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        meta:
          description: Optional details, e.g. per-field validation messages

    # ------------------------------------------------------------ auth / user
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Profile:
      type: object
      required: [id, email, full_name, active]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        active:
          type: boolean

    AccountChange:
      type: object
      required: [email, full_name]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string

    ChangePassword:
      type: object
      required: [password, password_confirm]
      properties:
        password:
          type: string
          format: password
        password_confirm:
          type: string
          format: password

    RefreshToken:
      type: object
      required: [id, identity_id, client_id, scopes, expires_at, revoked, created_at]
      properties:
        id:
          type: integer
        identity_id:
          type: integer
        client_id:
          type: string
        scopes:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ workspaces
    Workspace:
      type: object
      required: [id, title, active, owner_email, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        active:
          type: boolean
        owner_email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    WorkspaceCreate:
      type: object
      required: [title, email]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          description: Owner email

    Member:
      type: object
      required: [id, email, full_name, role, date_joined, workspace_id]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        image:
          type: string
        role:
          type: string
        date_joined:
          type: string
          format: date-time
        workspace_id:
          type: integer

    MemberRemove:
      type: object
      required: [identity_id, workspace_id]
      properties:
        identity_id:
          type: integer
        workspace_id:
          type: integer

    Invitation:
      type: object
      required: [id, workspace_id, email, role, expires_at, created_at]
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
        invited_by:
          type: integer
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          description: Omitted until accepted
        revoked_at:
          type: string
          format: date-time
          description: Omitted until revoked
        created_at:
          type: string
          format: date-time

    InvitationCreate:
      type: object
      required: [workspace_id, email, role]
      properties:
        workspace_id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Must not be in the past

    # ------------------------------------------------------------ projects
    Project:
      type: object
      required: [id, title, workspace_id, owner_id, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        workspace_id:
          type: integer
        owner_id:
          type: integer
        meta:
          type: string
          description: Omitted when empty
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Omitted when never updated

    ProjectCreate:
      type: object
      required: [title, workspace_id]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 50
        workspace_id:
          type: integer

    # ------------------------------------------------------------ boards
    Board:
      type: object
      required: [id, title, project_id, stage_count, issue_count, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        project_id:
          type: integer
        stage_count:
          type: integer
          description: Number of columns
        issue_count:
          type: integer
          description: Number of tasks
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Omitted when never updated

    BoardCreate:
      type: object
      required: [title, project_id]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 50
        project_id:
          type: integer

    # ------------------------------------------------------------ columns
    Column:
      type: object
      required: [id, title, meta, board_id, position, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        meta:
          $ref: '#/components/schemas/ColumnMeta'
        board_id:
          type: integer
        position:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Always present from `/columns`; omitted when never updated in the
            `move_column` response.

    ColumnMeta:
      type: object
      description: Currently always the defaults below; not persisted yet.
      required: [color, icon, expanded]
      properties:
        color:
          type: string
          example: default
        icon:
          type: string
          example: default
        expanded:
          type: boolean
          example: true

    ColumnCreate:
      type: object
      required: [title, board_id]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 50
        order:
          type: number
          description: Position of the column (stored as `position`)
        board_id:
          type: integer

    ColumnDeleteResult:
      type: object
      required: [id, tasks]
      properties:
        id:
          type: integer
          description: Deleted column id
        tasks:
          type: array
          nullable: true
          description: Ids of the tasks deleted with the column
          items:
            type: integer

    # ------------------------------------------------------------ tasks
    Task:
      type: object
      required: [id, title, completed, meta, project_id, position, owner_id, assignees, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
          description: Omitted when empty
        completed:
          type: boolean
          description: Not implemented yet, always `false`
        meta:
          type: string
          description: Not implemented yet, always empty
        project_id:
          type: integer
        board_id:
          type: integer
          description: Omitted when `0`
        column_id:
          type: integer
          description: Omitted when `0`
        position:
          type: number
        owner_id:
          type: integer
          description: Not implemented yet, always `0`
        assignees:
          type: array
          nullable: true
          items:
            type: integer
        due_to:
          type: string
          format: date-time
          description: Omitted when not set
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Omitted when never updated

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
        project_id:
          type: integer
        position:
          type: number
        column_id:
          type: integer
        board_id:
          type: integer
        due_to:
          type: string
          format: date-time

    TaskUpdate:
      type: object
      required: [task_id, title]
      properties:
        task_id:
          type: integer
          minimum: 1
        title:
          type: string
        body:
          type: string

    TaskAssign:
      type: object
      required: [task_id, identity_id]
      properties:
        task_id:
          type: integer
        identity_id:
          type: integer

    BoardAction:
      type: object
      required: [action, data]
      properties:
        action:
          type: string
          enum: [move_task, move_column, change_stage]
        data:
          oneOf:
            - $ref: '#/components/schemas/MoveTaskData'
            - $ref: '#/components/schemas/MoveColumnData'
            - $ref: '#/components/schemas/ChangeStageData'
      example:
        action: change_stage
        data:
          task_id: 42
          board_id: 3
          column_id: 7
          position: 1024.5

    MoveTaskData:
      type: object
      description: Reorder a task inside its column.
      required: [board_id, task_id, position]
      properties:
        board_id:
          type: integer
        task_id:
          type: integer
        position:
          type: number

    MoveColumnData:
      type: object
      description: Reorder a column on its board.
      required: [board_id, column_id, position]
      properties:
        board_id:
          type: integer
        column_id:
          type: integer
        position:
          type: number

    ChangeStageData:
      type: object
      description: Move a task into another column.
      required: [task_id, board_id, column_id, position]
      properties:
        task_id:
          type: integer
        board_id:
          type: integer
        column_id:
          type: integer
        position:
          type: number
