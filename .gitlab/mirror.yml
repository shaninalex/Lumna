stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github https://shaninalex:${GH_TOKEN}@github.com/shaninalex/Lumna.git || git remote set-url github https://shaninalex:${GH_TOKEN}@github.com/shaninalex/Lumna.git
    - git fetch --unshallow || true
    - git fetch --all --tags
    - git checkout -B main origin/main
    - git push --force github main:refs/heads/main
