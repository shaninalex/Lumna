stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache git openssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:shaninalex/Lumna.git || git remote set-url github git@github.com:shaninalex/Lumna.git
    - git fetch --unshallow || true
    - git fetch --all --tags
    - git checkout -B main origin/main
    - git push --force github main:refs/heads/main
