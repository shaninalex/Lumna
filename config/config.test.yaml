env: testing

serve:
  port: 8000
  setup: true
  # false only for plain-http local development
  secure_cookies: false

database:
  type: "sqlite"
  url: "file::memory:?cache=shared"

secret_key: "a-string-secret-at-least-256-bits-long"

smtp:
  host: localhost
  port: 1025
  user:
  password:
  from: "org@lumna.com"
  server_url: "http://localhost:8080"

# token lifetimes in minutes (defaults: 15 / 43200)
auth:
  access_ttl: 15
  refresh_ttl: 43200
