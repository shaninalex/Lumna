env: testing

serve:
  port: 8000
  setup: true
  # allow a SPA on another origin to call the API with cookies;
  # empty = same-origin only
  cors_origins: []
  # false only for plain-http local development
  secure_cookies: false

database:
  type: "sqlite"
  url: "file::memory:?cache=shared"

secret_key: "a-string-secret-at-least-256-bits-long"

email:
  host: "mail.google.com"
  port: 587
  username: "email@example.com"
  password: "password"

# token lifetimes in minutes (defaults: 15 / 43200)
auth:
  access_ttl: 15
  refresh_ttl: 43200
