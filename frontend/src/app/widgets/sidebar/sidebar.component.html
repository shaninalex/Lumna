<nav class="sidebar h-100 bg-body-tertiary" [ngClass]="{ 'sidebar-closed': !hideSidebar() }">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a routerLink="/app/overview" class="nav-link text-body fs-6">
                <ng-icon name="reiconInbox"/>
                <span class="sidebar-nav-link">Overview</span>
            </a>
        </li>
        <li class="nav-item">
            <a routerLink="/app/recent" class="nav-link text-body fs-6">
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Recent</span>
            </a>
        </li>
        <li class="nav-item">
            <a routerLink="/app/notifications" class="nav-link text-body fs-6">
                <ng-icon name="reiconBell"/>
                <span class="sidebar-nav-link">Notifications</span>
            </a>
        </li>
        <li class="nav-item">
            <a routerLink="/app/plugins" class="nav-link text-body fs-6">
                <ng-icon name="reiconPlug2"/>
                <span class="sidebar-nav-link">Plugins</span>
            </a>
        </li>
        <li>
            <hr>
        </li>
        <li class="nav-item">
            <span class="nav-link fs-6"
               [ngClass]="{
                    'disabled': projects().length === 0,
                    'text-body': projects().length > 0,
               }">
                <ng-icon name="reiconPage"/>
                <span class="sidebar-nav-link">Projects</span>
            </span>
            <ul>
                @for (p of projects(); track p.id) {
                    <li>
                        <a [routerLink]="appRoutes.projectDetail(p.id)"
                           class="text-body text-decoration-none"
                           [ngClass]="{'fw-bold': p.id === currentProject()?.id}">
                            <span class="sidebar-nav-link">{{ p.title }}</span>
                        </a>
                    </li>
                }
            </ul>
        </li>

        <li class="nav-item">
            <span class="nav-link text-body fs-6">
                <ng-icon name="reiconNotebookSquare"/>
                <span class="sidebar-nav-link">Workspaces</span>
            </span>
            <ul>
                @for (wp of workspaces(); track wp.id) {
                    <li>
                        <a [routerLink]="appRoutes.workspaceDetail(wp.id)"
                           class="text-body text-decoration-none"
                           [ngClass]="{'fw-bold': wp.id === currentWorkspace()?.id}">
                            <span class="sidebar-nav-link">{{ wp.title }}</span>
                        </a>
                    </li>
                }
            </ul>
        </li>
    </ul>

    <ul class="nav flex-column">
        <li class="nav-item">
            <hr class="mb-0"/>
        </li>
        <li class="nav-item">
            <a class="nav-link text-body fs-6" [routerLink]="['/app/settings']">
                <ng-icon name="reiconSettings2"/>
                <span class="sidebar-nav-link">Settings</span>
            </a>
        </li>
    </ul>
</nav>
