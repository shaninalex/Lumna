<nav class="sidebar h-100 bg-body-tertiary" [ngClass]="{ 'sidebar-closed': !hideSidebar() }">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a href="#" class="nav-link text-body">
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Overview</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link text-body">
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Recent</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link disabled" aria-disabled="true">
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Plugins</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link"
               [ngClass]="{
                    'disabled': projects().length === 0,
                    'text-body': projects().length > 0,
               }"
            >
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Projects</span>
            </a>
            <ul>
                @for (p of projects(); track p.id) {
                    <li>
                        <a [routerLink]="appRoutes.projectDetail(p.id)"
                           class="text-body text-decoration-none"
                           [ngClass]="{'fw-bold': p.id === currentProject()?.id}">
                            {{ p.title }}
                        </a>
                    </li>
                }
            </ul>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link text-body">
                <ng-icon name="reiconClockSquare"/>
                <span class="sidebar-nav-link">Workspaces</span>
            </a>
            <ul>
                @for (wp of workspaces(); track wp.id) {
                    <li>
                        <a [routerLink]="appRoutes.workspaceDetail(wp.id)"
                           class="text-body text-decoration-none"
                           [ngClass]="{'fw-bold': wp.id === currentWorkspace()?.id}">
                            {{ wp.title }}
                        </a>
                    </li>
                }
            </ul>
        </li>
    </ul>

    <ul class="nav flex-column">
        <li class="nav-item">
            <hr class="mb-0"/>
        </li>
        <li class="nav-item">
            <a class="nav-link text-body" [routerLink]="appRoutes.workspaceRoot(['settings'])">
                <ng-icon name="reiconSettings2"/>
                <span class="sidebar-nav-link">Workspace settings</span>
            </a>
        </li>
    </ul>
</nav>
