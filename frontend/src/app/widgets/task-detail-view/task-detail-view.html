@if (task$ | async; as t) {

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="mb-3 d-flex gap-2 align-items-center justify-content-between">
                <nav class="lu-breadcrumb">
                    <a [routerLink]="appRoutes.board(t.boardId)">Development</a>
                </nav>

                <button
                    matButton="filled"
                    type="submit"
                    (click)="submit($event)"
                    [disabled]="taskEditForm().invalid()">
                    Save
                    <lu-spinner [loading]="loading" />
                </button>
            </div>

            <div class="w-100">
                <mat-form-field class="w-100 mb-3">
                    <mat-label>Title</mat-label>
                    <input matInput id="title" type="text" placeholder="Task title"
                           [formField]="taskEditForm.title"/>
                </mat-form-field>
                <div class="mb-3">
                    <div class="text-muted small mb-2">Description</div>
                    <div class="NgxEditor__Wrapper">
                        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
                        <ngx-editor
                            [editor]="editor"
                            [(ngModel)]="html"
                            [disabled]="false"
                            [placeholder]="'Type here...'"
                            (ngModelChange)="onBodyChange($event)"
                        ></ngx-editor>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <mat-card class="mb-3 mt-5">
                <mat-card-header>
                    <mat-card-title>Details</mat-card-title>
                </mat-card-header>
                <mat-list>
                    @if (t.dueTo) {
                        <mat-list-item>
                            <span matListItemTitle class="text-muted">Due to</span>
                            <span matListItemMeta>{{ t.dueTo | date }}</span>
                        </mat-list-item>
                    }
                    <mat-list-item>
                        <span matListItemTitle class="text-muted">Created</span>
                        <span matListItemMeta>{{ t.createdAt | date }}</span>
                    </mat-list-item>
                    @if (t.updatedAt) {
                        <mat-list-item>
                            <span matListItemTitle class="text-muted">Updated</span>
                            <span matListItemMeta>{{ t.updatedAt | timeAgo }}</span>
                        </mat-list-item>
                    }
                </mat-list>
            </mat-card>
        </div>
    </div>
}
