@if (task$ | async; as t) {
    <nav class="mb-3 d-flex gap-2">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="appRoutes.board(t.boardId)">Development</a></li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="mb-3">
                <button
                    class="btn btn-sm btn-primary d-inline-flex align-items-center"
                    type="submit"
                    (click)="submit($event)"
                    [disabled]="taskEditForm().invalid()">
                    Save
                    <lu-spinner [loading]="loading" />
                </button>
            </div>

            <div class="w-100">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input id="title" class="form-control" type="text" placeholder="Task title"
                           [formField]="taskEditForm.title"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <div class="NgxEditor__Wrapper">
                        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
                        <ngx-editor
                            [editor]="editor"
                            [(ngModel)]="html"
                            [disabled]="false"
                            [placeholder]="'Type here...'"
                            (ngModelChange)="onBodyChange($event)"
                        ></ngx-editor>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <div class="card mb-3">
                <div class="card-header">
                    Details
                </div>
                <div class="list-group list-group-flush">
                    @if (t.dueTo) {
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Due to</span>
                            <span>{{ t.dueTo | date }}</span>
                        </div>
                    }
                    <div class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">Created</span>
                        <span>{{ t.createdAt | date }}</span>
                    </div>
                    @if (t.updatedAt) {
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Updated</span>
                            <span>{{ t.updatedAt | timeAgo }}</span>
                        </div>
                    }
                </div>
            </div>

            @if (activities | async; as activities) {
                <lu-activity-list [activities]="activities"/>
            }

        </div>
    </div>
}
