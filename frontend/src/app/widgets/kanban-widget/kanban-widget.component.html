@if (board$ | async; as board) {
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">{{ board.title }}</h2>
            <p class="text-muted mb-0">
                {{ cardsAmount() }} cards
                @if (board.updated_at) {
                    · Updated {{ board.updated_at | timeAgo }}
                }
            </p>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" disabled>
                <i class="fa-solid fa-filter me-2"></i>
                Filter
            </button>

            <button class="btn btn-sm btn-outline-secondary" disabled>
                <i class="fa-solid fa-users me-2"></i>
                Members
            </button>

            <a class="btn btn-sm btn-primary" [routerLink]="appRoutes.createTask(boardId())">
                <i class="fa-solid fa-plus me-2"></i>
                New Task
            </a>
        </div>
    </div>

    <div cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="dropColumn($event)"
         class="d-flex gap-3 pb-2">
        <!-- Column -->
        <div cdkDropListGroup class="d-flex gap-3">
            @if (kolumns$ | async; as columns) {
                @for (c of columns; track c.id) {
                    <div cdkDrag [cdkDragData]="c" class="card board-column">
                        <div class="card-header justify-content-between d-flex">
                            <h4 class="mb-0 flex-grow-1">{{ c.title }}</h4>

                            <button cdkDragHandle class="btn btn-sm">
                                <span class="icon">
                                    <i class="fa-regular fa-hand"></i>
                                </span>
                            </button>

                            <lu-column-menu-dropdown [stageId]="c.id">
                                <lu-column-delete-prompt columnMenuSlot class="list-group-item list-group-item-action p-0 text-danger" [stageId]="c.id" />
                            </lu-column-menu-dropdown>
                        </div>

                        <div class="card-header">
                            <lu-task-inline-form
                                [column_id]="c.id"
                                [board_id]="c.board_id"
                                [task_count]="c.tasks.length"
                            />
                        </div>

                        <!-- Tasks -->
                        <div class="p-3 d-flex flex-column gap-2" cdkDropList
                             [cdkDropListData]="c.tasks"
                             (cdkDropListDropped)="dropTask($event, c)"
                        >
                            @for (task of c.tasks; track task.id) {
                                <div cdkDrag [cdkDragData]="task">
                                    <lu-task-card [task]="task">
                                        <lu-assignment-dropdown assignmentSlot [task]="task"/>
                                    </lu-task-card>
                                </div>
                            }
                        </div>
                    </div>
                }
            }

            <lu-new-column-form [board_id]="boardId()" [position]="columnsAmount()"/>
        </div>
    </div>
}
