@if (board$ | async; as board) {
    <div class="row mb-4">
        <div class="col-8">
            <div class="d-flex align-items-center gap-3">
                <h2 class="mb-1">{{ board.title }}</h2>
            </div>
            <p class="text-muted mb-0">
                {{ cardsAmount() }} cards
                @if (board.updatedAt) {
                    · Updated {{ board.updatedAt | timeAgo }}
                }
            </p>
        </div>
    </div>

    <div cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="dropColumn($event)"
         class="d-flex gap-3 pb-2">
        <!-- Column -->
        <div cdkDropListGroup class="d-flex gap-3">
            @if (kolumns$ | async; as columns) {
                @for (c of columns; track c.id) {
                    <div cdkDrag [cdkDragData]="c" class="board-column">
                        <div class="column-header d-flex align-items-center gap-1 ps-3 pe-1 py-1">
                            <div class="column-title flex-grow-1 text-truncate">{{ c.title }}</div>
                            <button matIconButton cdkDragHandle type="button" aria-label="Drag column">
                                <mat-icon>back_hand</mat-icon>
                            </button>

                            <lu-add-task-plus-btn [columnId]="c.id"/>
                            <lu-column-menu-dropdown [stageId]="c.id">
                                <lu-column-delete-prompt
                                    columnMenuSlot
                                    class="text-danger"
                                    [stageId]="c.id"/>
                            </lu-column-menu-dropdown>
                        </div>

                        <!-- Tasks -->
                        <div class="task-list p-2 d-flex flex-column gap-2" cdkDropList
                             [cdkDropListData]="c.tasks"
                             (cdkDropListDropped)="dropTask($event, c)"
                        >
                            <lu-task-column-form
                                position="top"
                                [columnId]="c.id"
                                [boardId]="c.boardId"
                                [taskCount]="c.tasks.length"
                                [projectId]="projectId()"
                                [nextPosition]="c.tasks.length ? c.tasks[0].position / 2: 1"
                            />
                            @for (task of c.tasks; track task.id) {
                                <div cdkDrag [cdkDragData]="task" class="task-item">
                                    <lu-task-card [task]="task">
                                        <lu-assignment-dropdown assignmentSlot [task]="task"/>
                                    </lu-task-card>
                                </div>
                            }
                            <lu-task-column-form
                                position="bottom"
                                [columnId]="c.id"
                                [boardId]="c.boardId"
                                [taskCount]="c.tasks.length"
                                [projectId]="projectId()"
                                [nextPosition]="c.tasks.length ? c.tasks[c.tasks.length - 1].position + 0.5 : 1"
                            />
                        </div>

                        <lu-add-task-btn [columnId]="c.id"/>
                    </div>
                }
            }

            <lu-new-column-form [boardId]="boardId()" [position]="columnsAmount()"/>
        </div>
    </div>
}
