<lu-main-layout>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Backlog</h2>
                <p class="text-muted mb-0">
                    All tasks across every board
                </p>
            </div>

            <a
                [routerLink]="[...appRoutes.createTask()]"
                [queryParams]="{ return_to: returnTo() }"
                class="btn btn-primary btn-sm"
            >
                <i class="fa-solid fa-plus me-2"></i>
                New Task
            </a>
        </div>

        @if (data$ | async; as data) {
            <div class="mb-5">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <span class="badge text-bg-secondary">{{ data.tasks.length }} tasks</span>
                </div>

                <div class="list-group">
                    @for (item of data.tasks; track $index) {
                        <lu-task-list-item [task]="item" />
                    }
                </div>
            </div>
        }
    </div>
</lu-main-layout>
