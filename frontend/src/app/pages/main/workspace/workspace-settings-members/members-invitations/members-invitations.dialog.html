<div class="card">
    <div class="card-body">
        <h1>Invite</h1>

        <div>
            <input type="email" [(ngModel)]="data.email" placeholder="Email" autocomplete="off"/>
        </div>

        <div>
            <select [(ngModel)]="data.role">
                <option value="member" selected>Member</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div>
            <button (click)="submit()">Invite</button>
            <button (click)="close()">Cancel</button>
        </div>
    </div>
</div>
