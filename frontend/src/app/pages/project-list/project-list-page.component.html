<lu-global-layout>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <div class="text-muted small">Workspace</div>
                <div class="d-flex align-items-center gap-3">
                    <h2 class="lu-page-title">Lumna Dev</h2>

                    <a matButton routerLink="/app/workspaces">
                        <mat-icon>swap_horiz</mat-icon>
                        Switch workspace
                    </a>
                </div>
            </div>

            @if (workspace$ | async; as workspace) {
                <a matButton="filled" [routerLink]="[...appRoutes.projectsCreate()]">
                    <mat-icon>add</mat-icon>
                    New Project
                </a>
            }
        </div>

        <div class="row g-4">
            @if (workspace$ | async; as workspace) {
                @for (item of workspace.projects; track $index) {
                    <div class="col-12 col-md-6 col-xl-4">
                        <lu-project-card [project]="item" />
                    </div>
                }
            }
        </div>
    </div>
</lu-global-layout>
