<h2 mat-dialog-title>Invite</h2>
<mat-dialog-content>
    <mat-form-field class="w-100 mt-2">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="data.email" name="email" autocomplete="off" />
    </mat-form-field>

    <mat-form-field class="w-100 mt-3">
        <mat-label>Role</mat-label>
        <mat-select [(ngModel)]="data.role" name="role">
            <mat-option value="member">Member</mat-option>
            <mat-option value="admin">Admin</mat-option>
        </mat-select>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button matButton type="button" (click)="close()">Cancel</button>
    <button matButton="filled" type="button" (click)="submit()">Invite</button>
</mat-dialog-actions>
