<h2 mat-dialog-title>Delete column with all tasks in it?</h2>
<mat-dialog-content>
    <p>Tasks without column will move to the draft table.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button type="button" matButton (click)="dialogRef.close({ withTasks: false, cancel: true })">Cancel</button>
    <button type="button" matButton="outlined" class="lu-danger" (click)="dialogRef.close({ withTasks: false, cancel: false })">Just column</button>
    <button type="button" matButton="filled" class="lu-danger" (click)="dialogRef.close({ withTasks: true, cancel: false })">With tasks</button>
</mat-dialog-actions>
