<button
    class="btn btn-sm btn-secondary"
    [cdkMenuTriggerFor]="theme"
    (cdkMenuOpened)="open = true"
    (cdkMenuClosed)="open = false"
>
    @if (project$ | async; as project) {
        @if (project) {
            <div class="project-icon">
                {{ project.title[0] }}
            </div>
            {{ project.title }}
        }
    } @else {
        Select project
    }
    @if (open) {
        <ng-icon name="reiconChevronUp" />
    } @else {
        <ng-icon name="reiconChevronDown" />
    }
</button>
<ng-template #theme>
    <div class="card" cdkMenu>
        @if (workspace$ | async; as workspace) {
            <div class="card-body border-top d-flex flex-column gap-2">
                @if (workspace.projects.length) {
                    @for (item of workspace.projects; track $index) {
                        <lu-project-list-item cdkMenuItem [project]="item"/>
                    }
                }
                <div>
                    <a
                        class="card-link"
                        cdkMenuItem
                        [routerLink]="['/app/w', workspace.workspace.id, 'projects']"
                    >
                        See all
                    </a>
                    <a
                        class="card-link"
                        [routerLink]="['/app/w', workspace.workspace.id, 'projects', 'create']"
                    >
                        Create project
                    </a>
                </div>
            </div>
        }
    </div>
</ng-template>
