@if (visible()) {
    <form (submit)="submit($event)" class="input-group mb-3">
        <input type="text" class="form-control form-control-sm" placeholder="Task title" [formField]="taskEditForm.title">
        <button class="btn btn-sm btn-outline-secondary" type="submit" [disabled]="taskEditFormModel().title === ''">Save</button>
    </form>
}
